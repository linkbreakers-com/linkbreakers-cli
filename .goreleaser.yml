version: 2

project_name: linkbreakers-cli

before:
  hooks:
    - go test ./...

builds:
  - id: linkbreakers
    binary: linkbreakers
    main: ./cmd/linkbreakers
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w
      - -X github.com/linkbreakers-com/linkbreakers-cli/internal/cli.Version={{ .Version }}
      - -X github.com/linkbreakers-com/linkbreakers-cli/internal/cli.Commit={{ .Commit }}
      - -X github.com/linkbreakers-com/linkbreakers-cli/internal/cli.Date={{ .Date }}

archives:
  - id: default
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_
      {{- .Version }}_
      {{- .Os }}_
      {{- .Arch }}

checksum:
  name_template: checksums.txt

release:
  github:
    owner: linkbreakers-com
    name: linkbreakers-cli

homebrew_casks:
  - name: linkbreakers
    ids: [default]
    binaries: [linkbreakers]
    homepage: https://linkbreakers.com/cli
    description: Official CLI for the Linkbreakers API
    license: MIT
    directory: Casks
    skip_upload: '{{ if index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}false{{ else }}true{{ end }}'
    commit_msg_template: "chore: update linkbreakers cask to {{ .Tag }}"
    commit_author:
      name: linkbreakers-bot
      email: support@linkbreakers.com
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/linkbreakers"]
          end
    repository:
      owner: linkbreakers-com
      name: homebrew-tap
      branch: main
      token: '{{ index .Env "HOMEBREW_TAP_GITHUB_TOKEN" }}'

changelog:
  use: git
