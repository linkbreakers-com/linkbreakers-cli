name: Update and Release CLI

on:
  repository_dispatch:
    types: [update-sdk]
  workflow_dispatch:
    inputs:
      force_release:
        description: "Create a release from the current HEAD even if OPENAPI_VERSION did not change."
        required: false
        type: boolean
        default: false
      release_version:
        description: "Required when force_release is true. Example: 1.45.2"
        required: false
        type: string

jobs:
  update-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      issues: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.5"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      - name: Fetch current version from swagger
        id: fetch-version
        run: |
          SWAGGER_URL="https://api.linkbreakers.com/internal/openapi/api/v1/api.swagger.json"
          NEW_VERSION=$(curl -s "$SWAGGER_URL" | jq -r '.info.version')
          echo "new_version=$NEW_VERSION" >> "$GITHUB_OUTPUT"
          echo "Swagger version: $NEW_VERSION"

      - name: Read current OPENAPI_VERSION
        id: current-version
        run: |
          if [ -f OPENAPI_VERSION ]; then
            CURRENT_VERSION=$(cat OPENAPI_VERSION)
          else
            CURRENT_VERSION="0.0.0"
          fi
          echo "current_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
          echo "Current version: $CURRENT_VERSION"

      - name: Compare versions
        id: compare
        run: |
          FORCE_RELEASE="${{ github.event_name == 'workflow_dispatch' && inputs.force_release || 'false' }}"
          RELEASE_VERSION="${{ inputs.release_version }}"
          SWAGGER_VERSION="${{ steps.fetch-version.outputs.new_version }}"
          CURRENT_VERSION="${{ steps.current-version.outputs.current_version }}"

          if [ "$FORCE_RELEASE" = "true" ]; then
            if [ -z "$RELEASE_VERSION" ]; then
              echo "release_version is required when force_release is true" >&2
              exit 1
            fi
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "target_version=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore: release CLI $RELEASE_VERSION" >> "$GITHUB_OUTPUT"
            echo "force_release=true" >> "$GITHUB_OUTPUT"
            echo "Manual release requested: $RELEASE_VERSION"
          elif [ "$SWAGGER_VERSION" = "$CURRENT_VERSION" ]; then
            echo "needs_update=false" >> "$GITHUB_OUTPUT"
            echo "target_version=$CURRENT_VERSION" >> "$GITHUB_OUTPUT"
            echo "force_release=false" >> "$GITHUB_OUTPUT"
            echo "Versions match. No update needed."
          else
            echo "needs_update=true" >> "$GITHUB_OUTPUT"
            echo "target_version=$SWAGGER_VERSION" >> "$GITHUB_OUTPUT"
            echo "commit_message=chore: update CLI to API version $SWAGGER_VERSION" >> "$GITHUB_OUTPUT"
            echo "force_release=false" >> "$GITHUB_OUTPUT"
            echo "Version changed: $CURRENT_VERSION -> $SWAGGER_VERSION"
          fi

      - name: Generate commands and docs
        id: generate
        if: steps.compare.outputs.needs_update == 'true' && steps.compare.outputs.force_release != 'true'
        run: |
          chmod +x ./scripts/generate-commands.sh
          ./scripts/generate-commands.sh
          go run ./cmd/linkbreakers gendocs

      - name: Build
        id: build
        if: steps.compare.outputs.needs_update == 'true'
        run: go build ./...

      - name: Configure Git
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Detect generated changes
        if: steps.compare.outputs.needs_update == 'true'
        id: changes
        run: |
          if git diff --quiet; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
            echo "No working tree changes to commit."
          else
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
            echo "Working tree changes detected."
          fi

      - name: Commit changes
        if: steps.compare.outputs.needs_update == 'true' && steps.changes.outputs.has_changes == 'true'
        run: |
          git add .
          git commit -m "${{ steps.compare.outputs.commit_message }}"

      # GoReleaser creates the GitHub release from a tag that must already exist on
      # the remote, so only the tag is pushed here. main moves after a successful
      # release, and a failed release deletes the tag again.
      - name: Create and push tag
        id: tag
        if: steps.compare.outputs.needs_update == 'true'
        run: |
          NEW_VERSION="${{ steps.compare.outputs.target_version }}"
          git tag "v$NEW_VERSION"
          git push origin "v$NEW_VERSION"

      - name: Run GoReleaser
        id: goreleaser
        if: steps.compare.outputs.needs_update == 'true'
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: latest
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_SSH_KEY: ${{ secrets.HOMEBREW_TAP_SSH_KEY }}

      - name: Push version commit
        id: push
        if: steps.compare.outputs.needs_update == 'true'
        run: git push origin HEAD:main

      - name: Close release failure issues
        if: success() && steps.compare.outputs.needs_update == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.compare.outputs.target_version }}
        run: |
          for number in $(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[].number'); do
            gh issue close "$number" --repo "$GITHUB_REPOSITORY" --comment "Released v${TARGET_VERSION}."
          done

      - name: Publish npm package
        id: npm
        if: ${{ !cancelled() && steps.goreleaser.outcome != 'failure' }}
        continue-on-error: true
        working-directory: npm
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName | sed 's/^v//')
          PUBLISHED=$(npm view linkbreakers-cli version 2>/dev/null || echo none)
          if [ "$VERSION" = "$PUBLISHED" ]; then
            echo "linkbreakers-cli@$VERSION is already on npm."
            exit 0
          fi
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          npm install -g npm@latest
          npm version "$VERSION" --no-git-tag-version --allow-same-version
          npm publish --provenance --access public

      - name: Report npm failure
        if: steps.npm.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MESSAGE: "Publishing linkbreakers-cli@${{ env.VERSION }} to npm failed. The GitHub release and Homebrew cask are unaffected; every run of this workflow retries until npm matches the latest release. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
        run: |
          echo "::error title=npm package not published::${MESSAGE}"
          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and release workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "npm package linkbreakers-cli failing to publish" --body "$MESSAGE"
          fi

      - name: Remove unreleased tag
        if: failure() && steps.tag.outcome == 'success' && steps.goreleaser.outcome != 'success'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ steps.compare.outputs.target_version }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          git push origin --delete "$TAG"

      - name: Report failure
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TARGET_VERSION: ${{ steps.compare.outputs.target_version || steps.fetch-version.outputs.new_version || 'unknown' }}
          CURRENT_VERSION: ${{ steps.current-version.outputs.current_version }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GENERATE: ${{ steps.generate.outcome }}
          BUILD: ${{ steps.build.outcome }}
          TAG: ${{ steps.tag.outcome }}
          GORELEASER: ${{ steps.goreleaser.outcome }}
          PUSH: ${{ steps.push.outcome }}
        run: |
          FAILED=""
          [ "$GENERATE" = "failure" ] && FAILED="$FAILED Generate commands and docs,"
          [ "$BUILD" = "failure" ] && FAILED="$FAILED Build,"
          [ "$TAG" = "failure" ] && FAILED="$FAILED Create and push tag,"
          [ "$GORELEASER" = "failure" ] && FAILED="$FAILED Run GoReleaser,"
          [ "$PUSH" = "failure" ] && FAILED="$FAILED Push version commit,"
          FAILED="${FAILED%,}"
          FAILED="${FAILED# }"
          FAILED="${FAILED:-an earlier step}"

          MESSAGE="The CLI update to API v${TARGET_VERSION} failed at: ${FAILED}. The CLI stays on v${CURRENT_VERSION} until this is fixed and the workflow is re-run. Run: ${RUN_URL}"
          echo "::error title=CLI update failed::${MESSAGE}"
          echo "### CLI update failed" >> "$GITHUB_STEP_SUMMARY"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"

          gh label create release-failure --repo "$GITHUB_REPOSITORY" --color B60205 \
            --description "The update and release workflow failed" --force
          EXISTING=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --label release-failure --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "$GITHUB_REPOSITORY" --body "$MESSAGE"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --label release-failure \
              --title "CLI update and release failing" --body "$MESSAGE"
          fi
